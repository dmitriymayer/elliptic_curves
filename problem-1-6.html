function lemF(u, steps) {

  var b = Math.asin(u), h = b / steps, s = 0;

}
var QUARTER = lemF(1, 4000);               // ϖ/2
// Таблица для обращения F: r = sin φ, s = F(r)
var TABLE = (function () {
  var n = 3000, h = (Math.PI / 2) / n, phi = [0], len = [0];
  for (var k = 1; k <= n; k++) {
    var a = Math.sin((k - 1) * h), m = Math.sin((k - 0.5) * h), b = Math.sin(k * h);
    len.push(len[k - 1] + h / 6 * (1 / Math.sqrt(1 + a * a) + 4 / Math.sqrt(1 + m * m) + 1 / Math.sqrt(1 + b * b)));
    phi.push(k * h);
  }
  return { phi: phi, len: len };
})();
function lemSl(s) {                         // лемнискатный синус на [0, ϖ/2]
  var L = TABLE.len, lo = 0, hi = L.length - 1;
  if (s <= 0) return 0;
  if (s >= L[hi]) return 1;
  while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (L[mid] < s) lo = mid; else hi = mid; }
  var t = (s - L[lo]) / (L[hi] - L[lo]);
  return Math.sin(TABLE.phi[lo] + t * (TABLE.phi[hi] - TABLE.phi[lo]));
}
function euler(u1, u2) {
  return (u1 * Math.sqrt(1 - Math.pow(u2, 4)) + u2 * Math.sqrt(1 - Math.pow(u1, 4))) / (1 + u1 * u1 * u2 * u2);
}

// ---------- геометрия ----------
var L_CX = 300, L_CY = 190, L_SC = 250;     // лемниската
var C_CX = 300, C_CY = 200, C_R = 160;      // окружность
function lemPoint(s) {                      // точка на правой петле на расстоянии s по дуге от центра
  var up = s <= QUARTER, r = lemSl(up ? s : 2 * QUARTER - s);
  var th = 0.5 * Math.acos(Math.min(1, r * r)) * (up ? 1 : -1);
  return [L_CX + L_SC * r * Math.cos(th), L_CY - L_SC * r * Math.sin(th)];
}
function circPoint(s) {                     // точка окружности, отсчёт дуги от (1, 0)
  return [C_CX + C_R * Math.cos(s), C_CY - C_R * Math.sin(s)];
}
function arcPath(pt, a, b) {
  if (b - a < 1e-6) return '';
  var n = Math.max(2, Math.ceil((b - a) * 120)), d = '';
  for (var i = 0; i <= n; i++) {
    var p = pt(a + (b - a) * i / n);
    d += (i ? ' L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
  }
  return d;
}
var LEM_PATH = (function () {
  var d = '', n = 400;
  for (var i = 0; i <= n; i++) {
    var t = 2 * Math.PI * i / n, den = 1 + Math.pow(Math.sin(t), 2);
    var x = Math.cos(t) / den, y = Math.sin(t) * Math.cos(t) / den;
    d += (i ? ' L' : 'M') + (L_CX + L_SC * x).toFixed(1) + ' ' + (L_CY - L_SC * y).toFixed(1);
  }
  return d + ' Z';
})();
var CIRC_PATH = 'M' + (C_CX + C_R) + ' ' + C_CY + ' A' + C_R + ' ' + C_R + ' 0 1 0 ' + (C_CX - C_R) + ' ' + C_CY + ' A' + C_R + ' ' + C_R + ' 0 1 0 ' + (C_CX + C_R) + ' ' + C_CY + ' Z';
// квадрат (u1, u2): x = 30 + 200 u1, y = 210 − 200 u2
function boundaryPts(lem) {
  var pts = [];
  for (var i = 0; i <= 100; i++) {
    var u1 = i / 100, u2 = lem ? Math.sqrt((1 - u1 * u1) / (1 + u1 * u1)) : Math.sqrt(1 - u1 * u1);
    pts.push([30 + 200 * u1, 210 - 200 * u2]);
  }
  return pts;
}
function ptsPath(p) { return p.map(function (q, i) { return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' '); }
var BOUND = { lem: boundaryPts(true), circ: boundaryPts(false) };

function sci(v) {
  var a = Math.abs(v);
  if (a === 0) return '0';
  if (a < 1e-3) { var e = Math.floor(Math.log10(a)); return (v < 0 ? '−' : '') + (a / Math.pow(10, e)).toFixed(1) + '·10' + String(e).replace('-', '⁻').replace(/\d/g, function (c) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]; }); }
  return (v < 0 ? '−' : '') + a.toFixed(6);
}
function f12(v) { return v.toFixed(12); }

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'lem', u1: 0.3, u2: 0.5, tab: 'terms' }; }
  renderVals() {
    var self = this;
    var st = this.state || { mode: 'lem', u1: 0.3, u2: 0.5, tab: 'terms' };
    var one = false, tab = st.tab || 'terms';
    var lem = st.mode === 'lem', u1 = st.u1, u2 = st.u2;
    var I1, I2, U, IU, half, pt;
    if (lem) {
      I1 = lemF(u1); I2 = lemF(u2); U = euler(u1, u2); IU = lemF(Math.min(U, 1)); half = QUARTER; pt = lemPoint;
    } else {
      I1 = Math.asin(u1); I2 = Math.asin(u2);
      U = u1 * Math.sqrt(1 - u2 * u2) + u2 * Math.sqrt(1 - u1 * u1);
      IU = Math.asin(Math.min(U, 1)); half = Math.PI / 2; pt = circPoint;
    }
    var S = I1 + I2, past = S > half + 1e-12;
    var pv = pt(half);
    var BLUE = '#2346C8', ORANGE = '#C2410C', GREEN = '#0F7B52', GREY = '#6B7080';
    var CX0 = lem ? L_CX : C_CX, mir = function (q) { var p = pt(q); return [2 * CX0 - p[0], p[1]]; };
    var nU = lem ? '∫₀^U' : 'arcsin U', n1 = lem ? '∫₀^u₁' : 'arcsin u₁', n2 = lem ? '∫₀^u₂' : 'arcsin u₂';
    var paths = [], dots = [], labels = [], legend = [], legendText;
    function lab(p, t, c, dx, dy, an) { labels.push({ x: (p[0] + dx).toFixed(1), y: (p[1] + dy).toFixed(1), t: t, c: c, anchor: an || 'start' }); }
    function dot(p, c, fill, r) { dots.push({ x: p[0].toFixed(1), y: p[1].toFixed(1), c: c, fill: fill || '#FFFFFF', r: r || 7 }); }
    function lvl(p, c) {
      if (lem) paths.push({ d: 'M' + L_CX + ' ' + L_CY + ' L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1), c: c, w: 1.5, dash: '5 5' });
      else paths.push({ d: 'M' + (C_CX - C_R - 10) + ' ' + p[1].toFixed(1) + ' L' + (C_CX + C_R + 10) + ' ' + p[1].toFixed(1), c: c, w: 1.2, dash: '5 5' });
    }
    dot(pv, '#16181D', '#16181D', 4); lab(pv, 'вершина', '#565B69', lem ? -6 : 10, lem ? 28 : -10, lem ? 'end' : 'start');
    if (tab === 'terms') {
      var e1 = pt(I1), e2 = mir(I2);
      lvl(e1, BLUE); lvl(e2, ORANGE);
      paths.push({ d: arcPath(pt, 0, I1), c: BLUE, w: 8, dash: 'none' });
      paths.push({ d: arcPath(mir, 0, I2), c: ORANGE, w: 8, dash: 'none' });
      dot(pt(0), '#16181D', '#16181D', 5); if (!lem) dot(mir(0), '#16181D', '#16181D', 5);
      dot(e1, BLUE); dot(e2, ORANGE);
      lab(e1, lem ? 'r = u₁' : 'y = u₁', BLUE, 12, -10); lab(e2, lem ? 'r = u₂' : 'y = u₂', ORANGE, -12, -10, 'end');
      legend = [{ c: BLUE, w: '6px', style: 'solid', t: 'дуга длины ' + n1 + ' = ' + I1.toFixed(5) }, { c: ORANGE, w: '6px', style: 'solid', t: 'дуга длины ' + n2 + ' = ' + I2.toFixed(5) }];
      legendText = lem
        ? 'Каждый интеграл — длина дуги лемнискаты от центра до точки, удалённой от центра на uᵢ (лемма 1). Вторую дугу для наглядности откладываем на левой петле. Переключитесь на «Сумму», чтобы сложить их.'
        : 'Каждый арксинус — длина дуги единичной окружности от точки на оси x до высоты uᵢ (лемма А). Вторую дугу откладываем слева. Переключитесь на «Сумму», чтобы сложить их.';
    } else {
      var eU = pt(IU);
      lvl(eU, GREEN);
      paths.push({ d: arcPath(pt, 0, IU), c: GREEN, w: 13, dash: 'none' });
      paths.push({ d: arcPath(pt, 0, I1), c: BLUE, w: 4, dash: 'none' });
      paths.push({ d: arcPath(pt, I1, S), c: ORANGE, w: 4, dash: 'none' });
      if (past) paths.push({ d: arcPath(pt, S, 2 * half), c: GREY, w: 2.5, dash: '7 5' });
      dot(pt(0), '#16181D', '#16181D', 5); dot(eU, GREEN, '#FFFFFF', 8); if (past) dot(pt(S), ORANGE, '#FFFFFF', 5);
      lab(eU, lem ? 'r = U' : 'y = U', GREEN, 14, -12);
      legend = [{ c: GREEN, w: '10px', style: 'solid', t: 'дуга длины ' + nU + ' = ' + IU.toFixed(5) }, { c: BLUE, w: '4px', style: 'solid', t: n1 + ' (перенесена)' }, { c: ORANGE, w: '4px', style: 'solid', t: n2 + ' (приставлена следом)' }];
      if (past) legend.push({ c: GREY, w: '3px', style: 'dashed', t: 'остаток пути до ' + (lem ? 'центра' : 'точки (−1, 0)') });
      legendText = past
        ? 'Сумма длин больше ' + (lem ? 'ϖ/2' : 'π/2') + ': приставленные дуги перешли через вершину. Зелёная дуга до точки ' + (lem ? 'r = U' : 'y = U') + ' теперь равна не их сумме, а пунктирному остатку: ' + nU + ' = ' + (lem ? 'ϖ' : 'π') + ' − (' + n1 + ' + ' + n2 + ').'
        : 'Синяя и оранжевая дуги, приставленные друг к другу, ровно покрывают зелёную: ' + n1 + ' + ' + n2 + ' = ' + nU + '. Это и есть формула сложения.';
    }
    var diff = S - IU, diffPast = 2 * half - S - IU;
    var p0 = pt(0), p1 = pt(I1), p2 = pt(S);
    var bigName = lem ? 'ϖ' : 'π', iuName = lem ? '∫₀^U' : 'arcsin U';
    var vTitle, vText, vBg, vFg, vBd;
    if (!past) {
      vTitle = 'Сходится: разность ' + sci(diff);
      vText = (one ? 'Дуга короче ' : 'Две дуги вместе короче ') + (lem ? 'четверти лемнискаты (ϖ/2 ≈ 1,31103)' : 'четверти окружности (π/2)') + ', и их сумма равна интегралу до U с точностью вычислений.';
      vBg = '#EEF1FC'; vFg = '#16181D'; vBd = '1px solid #C7D0F5';
    } else {
      vTitle = 'Дуга прошла через вершину';
      vText = 'Сумма ' + S.toFixed(5) + ' больше ' + bigName + '/2 ≈ ' + half.toFixed(5) + ', поэтому ' + iuName + ' меряет короткий путь до той же точки. Равенство нарушено (разность ' + diff.toFixed(5) + '), зато верно ' + iuName + ' = ' + bigName + ' − сумма: разность ' + sci(diffPast) + '.';
      vBg = '#FBEFE6'; vFg = '#3A2A1E'; vBd = '1px dashed #B0470E';
    }
    var endR = lem ? Math.min(U, 1) : U;
    var radiusPath = lem
      ? 'M' + L_CX + ' ' + L_CY + ' L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1)
      : 'M' + (C_CX - C_R - 10) + ' ' + p2[1].toFixed(1) + ' L' + (C_CX + C_R + 10) + ' ' + p2[1].toFixed(1);
    var bnd = BOUND[lem ? 'lem' : 'circ'];
    var ok = ptsPath(bnd) + ' L30 210 Z';
    var presets = lem
      ? [{ label: 'малые: 0,1 и 0,2', a: 0.1, b: 0.2 }, { label: 'Фаньяно: √(√2−1) дважды', a: Math.sqrt(Math.SQRT2 - 1), b: Math.sqrt(Math.SQRT2 - 1) }, { label: 'за вершиной: 0,9 и 0,8', a: 0.9, b: 0.8 }]
      : [{ label: 'малые: 0,1 и 0,2', a: 0.1, b: 0.2 }, { label: 'удвоение: √2/2 дважды', a: Math.SQRT1_2, b: Math.SQRT1_2 }, { label: 'за вершиной: 0,9 и 0,8', a: 0.9, b: 0.8 }];
    var Uexpr = lem
      ? '(' + u1.toFixed(3) + '·√(1−' + u2.toFixed(3) + '⁴) + ' + u2.toFixed(3) + '·√(1−' + u1.toFixed(3) + '⁴)) / (1 + ' + u1.toFixed(3) + '²·' + u2.toFixed(3) + '²) = ' + f12(U)
      : u1.toFixed(3) + '·√(1−' + u2.toFixed(3) + '²) + ' + u2.toFixed(3) + '·√(1−' + u1.toFixed(3) + '²) = ' + f12(U);
    function setU(k) { return function (e) { var o = {}; o[k] = Math.max(0, Math.min(0.999, parseFloat(e.target.value))); self.setState(o); }; }
    var vert = lem ? [L_CX + L_SC - 30, L_CY + 32] : [C_CX + 8, C_CY - C_R - 8];
    var endLab = [p2[0] + (p2[0] > (lem ? L_CX : C_CX) ? 12 : -64), p2[1] + (p2[1] > (lem ? L_CY : C_CY) ? 26 : -12)];
    return {
      accent: this.props.accent ?? '#2346C8',
      modes: [{ id: 'lem', label: 'Лемниската · Фаньяно, Эйлер' }, { id: 'circ', label: 'Окружность · arcsin' }].map(function (m) {
        var on = st.mode === m.id;
        return { label: m.label, on: on, off: !on, pick: function () { self.setState({ mode: m.id }); } };
      }),
      figAria: lem ? 'Лемниската, две дуги, отложенные от центра одна за другой, и отрезок длины U до конца составной дуги' : 'Окружность, две дуги от точки (1, 0) одна за другой и уровень y = U',
      axX: lem ? L_CX : C_CX, axY: lem ? L_CY : C_CY,
      curvePath: lem ? LEM_PATH : CIRC_PATH,
      radiusPath: radiusPath,
      paths: paths, dots: dots, labels: labels, legend: legend,
      views: [['terms', 'Слагаемые: ' + n1 + ' и ' + n2], ['sum', 'Сумма: ' + nU]].map(function (v) { var on = tab === v[0]; return { label: v[1], on: on, bg: on ? '#FFFFFF' : 'transparent', fw: on ? 600 : 400, pick: function () { self.setState({ tab: v[0] }); } }; }),
      regimes: [[false, 'до вершины'], [true, 'за вершиной']].map(function (r) {
        var on = r[0] === past, col = r[0] ? '#B0470E' : '#2346C8';
        return { label: r[1], on: on, color: col, bg: on ? col : '#FFFFFF', fg: on ? '#FFFFFF' : col,
          pick: function () { self.setState(r[0] ? { u1: 0.9, u2: 0.8 } : { u1: 0.3, u2: 0.5 }); } };
      }),
      legendText: legendText,
      startX: p0[0].toFixed(1), startY: p0[1].toFixed(1),
      midX: p1[0].toFixed(1), midY: p1[1].toFixed(1),
      endX: p2[0].toFixed(1), endY: p2[1].toFixed(1),
      startLX: lem ? L_CX - 70 : C_CX + C_R + 8, startLY: lem ? L_CY + 28 : C_CY + 24,
      startLabel: lem ? 'центр' : '(1, 0)',
      endLX: endLab[0].toFixed(1), endLY: endLab[1].toFixed(1),
      endLabel: lem ? 'r = U' : 'y = U',
      vertLX: vert[0], vertLY: vert[1],
      lenName1: lem ? '∫₀^u₁' : 'arcsin u₁', lenName2: lem ? '∫₀^u₂' : 'arcsin u₂',
      dashName: lem ? 'расстояние от центра до конца: U' : 'высота конца дуги: U',
      u1: u1, u2: u2, u1s: u1.toFixed(3), u2s: u2.toFixed(3),
      onU1: setU('u1'), onU2: setU('u2'),
      presets: presets.map(function (p) { return { label: p.label, pick: function () { self.setState({ u1: p.a, u2: p.b }); } }; }),
      okRegion: ok, boundary: ptsPath(bnd),
      boundaryEq: lem ? 'u₁² + u₂² + u₁²u₂² = 1' : 'u₁² + u₂² = 1',
      sqX: (30 + 200 * u1).toFixed(1), sqY: (210 - 200 * u2).toFixed(1),
      onSquare: function (e) {
        var r = e.currentTarget.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width * 240, y = (e.clientY - r.top) / r.height * 240;
        var a = Math.max(0, Math.min(0.999, (x - 30) / 200)), b = Math.max(0, Math.min(0.999, (210 - y) / 200));
        self.setState({ u1: +a.toFixed(3), u2: +b.toFixed(3) });
      },
      vTitle: vTitle, vText: vText, vBg: vBg, vFg: vFg, vBd: vBd,
      nameI1: lem ? '∫₀^u₁ du/√(1−u⁴)' : 'arcsin u₁', nameI2: lem ? '∫₀^u₂ du/√(1−u⁴)' : 'arcsin u₂', nameIU: lem ? '∫₀^U du/√(1−u⁴)' : 'arcsin U',
      I1: f12(I1), I2: f12(I2), S: f12(S),
      Uexpr: Uexpr, IU: f12(IU),
      diff: past ? diff.toFixed(6) + '   (но ' + bigName + ' − сумма − ' + iuName + ' = ' + sci(diffPast) + ')' : sci(diff),
      diffColor: past ? '#FFB98A' : '#9BE3A8',
      methodNote: lem
        ? 'Интегралы считаются в браузере методом Симпсона на 1000 отрезках после замены u = sin φ: она убирает особенность в u = 1, и точность получается около 10⁻¹⁵. Формула для U — только корни и арифметика.'
        : 'Для окружности интегралы — это arcsin, их считает сам JavaScript. Формула для U — школьный синус суммы.'
    };
  }
}

return Component;
});
