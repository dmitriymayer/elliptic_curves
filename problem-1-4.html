      boundZ: '|z| ≤ ' + plans[0].Z + ' для A и |z| ≤ ' + plans[1].Z + ' для B (32z² ≤ ' + t + ')',
      rFormula: 'r = ' + t + ' − ' + a + 'x² − 8z²  (или − 32z² для B)',
      exHead: exHead, exText: exText,
      playing: !!st.playing, canPlay: !st.playing && gridsOn,
      play: function () {
        var k = st.step == null ? 0 : st.step;
        self.setState({ playing: true, step: k, focus: null });
        self.tick(total, delay);
      },
      pause: function () { clearTimeout(self._timer); self.setState({ playing: false }); },
      stepOne: function () {
        clearTimeout(self._timer);
        var k = st.step == null ? 1 : st.step + 1;
        self.setState({ playing: false, focus: null, step: k >= total ? null : k });
      },
      showAll: function () { clearTimeout(self._timer); self.setState({ playing: false, step: null, focus: null }); }
    };
  }
}

return Component;
});
</script>
