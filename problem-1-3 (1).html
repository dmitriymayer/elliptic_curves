      nextLabel: s < 3 ? 'Дальше: ' + STEP_TEXT[s + 1].toLowerCase() : (k < KMAX ? 'Строить ' + kname(k + 1) : 'Готово'),
      next: function () { if (s < 3) self.setState({ s: s + 1 }); else if (k < KMAX) self.setState({ k: k + 1, s: 0 }); },
      prev: function () { if (s > 0) self.setState({ s: s - 1 }); else if (k > 2) self.setState({ k: k - 1, s: 3 }); },
      reset: function () { self.setState({ k: 2, s: 0 }); },
      ta: short(ta, 120), tb: short(tb, 120), tc: short(tc, 120),
      tcheck: ok ? 'Проверено точной арифметикой: a² + b² = c², ab/2 = ' + n + '.' : 'Проверка не прошла',
      gridPath: gridPath, fitPath: fitPath, dataPath: dataPath, dotsPath: dotsPath,
      curDot: { x: GX(k).toFixed(1), y: GY(dig[k - 1]).toFixed(1) },
      yTop: { x: 62, y: (GY(ymax / 1.08) + 5).toFixed(1), t: Math.round(ymax / 1.08) },
      yMid: { x: 62, y: (GY(ymax / 2.16) + 5).toFixed(1), t: Math.round(ymax / 2.16) },
      xTicks: dig.map(function (d, i) { return { x: GX(i + 1).toFixed(1), t: i + 1 }; }),
      fitLabel: { x: (GX(9.5)).toFixed(1), y: (GY(cfit * 90.25) - 10).toFixed(1), t: '≈ ' + cfit.toFixed(2) + '·k²' },
      // калькулятор
      cModes: [['add', 'P + Q'], ['mul', 'k · P']].map(function (m) { var on = cmode === m[0]; return { label: m[1], on: on, off: !on, pick: function () { self.setState({ cmode: m[0] }); } }; }),
      targets: cmode === 'add'
        ? [['P', '#2346C8'], ['Q', '#0F6E6E']].map(function (t) { var on = st.target === t[0]; return { label: t[0], color: t[1], on: on, off: !on, pick: function () { self.setState({ target: t[0] }); } }; })
        : [{ label: 'P', color: '#2346C8', on: true, off: false, pick: function () {} }],
      cDown: cDrag.down, cMove: cDrag.move, cUp: cDrag.up, cLeave: cDrag.leave, cXT: cAxes.xt, cYT: cAxes.yt,
      cZoomIn: function () { self.setState({ cview: zoomed(CV, 0.5) }); }, cZoomOut: function () { self.setState({ cview: zoomed(CV, 2) }); }, cReset: function () { self.setState({ cview: null }); },
      cFit: function () { if (calcPts.length) self.setState({ cview: fitTo(calcPts.concat([[0, 0]]), 2, 3) }); },
      cGrid: cGrid, cAxX: cx(0).toFixed(1), cAxY: cy(0).toFixed(1), cCurve: cc.d, cLine: cLine, cRefl: cRefl, cMult: cMult, cTrail: cTrail,
      cP: { x: cx(cP.x).toFixed(1), y: cy(cP.y).toFixed(1), lx: (cx(cP.x) + 11).toFixed(1), ly: (cy(cP.y) - 11).toFixed(1) },
      cQ: { x: cx(cQ.x).toFixed(1), y: cy(cQ.y).toFixed(1), lx: (cx(cQ.x) + 11).toFixed(1), ly: (cy(cQ.y) - 11).toFixed(1), op: cmode === 'add' ? 1 : 0 },
      cR: cR, cS: cS,
      cEq: 'y² = x³' + aStr + bStr,
      ca: a, cb: b, caStr: a.toFixed(1).replace('-', '−'), cbStr: b.toFixed(1).replace('-', '−'),
      onA: function (e) { var v = parseFloat(e.target.value); var p = onCurve(v, b, st.cP.x, st.cP.y >= 0 ? 1 : -1) || { x: 3, y: Math.sqrt(cf(v, b, 3)) }, q = onCurve(v, b, st.cQ.x, st.cQ.y >= 0 ? 1 : -1) || p; self.setState({ ca: v, cP: p, cQ: q }); },
      onB: function (e) { var v = parseFloat(e.target.value); var p = onCurve(a, v, st.cP.x, st.cP.y >= 0 ? 1 : -1) || { x: 3, y: Math.sqrt(cf(a, v, 3)) }, q = onCurve(a, v, st.cQ.x, st.cQ.y >= 0 ? 1 : -1) || p; self.setState({ cb: v, cP: p, cQ: q }); },
      cPresets: C_PRESETS.map(function (pr) { return { label: pr.label, pick: function () { self.setState({ ca: pr.a, cb: pr.b, cP: onCurve(pr.a, pr.b, pr.P[0], pr.P[1] >= 0 ? 1 : -1), cQ: onCurve(pr.a, pr.b, pr.Q[0], pr.Q[1] >= 0 ? 1 : -1) }); } }; }),
      discNote: Math.abs(disc) < 1e-9 ? 'Дискриминант 4a³ + 27b² = 0: кривая особая, групповой закон на ней устроен иначе.' : 'Дискриминант 4a³ + 27b² = ' + disc.toFixed(2).replace('-', '−') + ' ≠ 0: кривая гладкая.',
      discColor: Math.abs(disc) < 1e-9 ? '#8E3A0B' : '#565B69',
      mulOn: cmode === 'mul', ck: st.ck, onK: function (e) { self.setState({ ck: parseInt(e.target.value, 10) }); },
      cInfo: cInfo, cCaption: cCaption
    };
  }
}


return Component;
});
